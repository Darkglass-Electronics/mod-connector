<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <title>mod-connector wasm test</title>
    <script src="mod-connector.js"></script>
    <script src="backend-data.js"></script>
    <script src="web-hid.js"></script>
  </head>
  <body>
    <header></header>
    <main>
        <input id="start" type="button" value="Start"/>
        <input id="stop" type="button" value="Stop"/>
        <br>
        <h3>state</h3>
        <pre id="state"></pre>
        <h3>feedback</h3>
        <pre id="feedback"></pre>
    </main>
    <footer></footer>
    <script>
        const DEVICE_PRODUCT_ID = 0x2500;
        const DEVICE_VENDOR_ID = 0x2fa6;
        let connector = null;
        let stopping = false;

        // init wasm on click
        let hid_setup = false;
        let hid_connected = false;
        document.getElementById('start').onclick = async () => {
          if (connector != null) {
            return;
          }

          stopping = false;

          try {
              let resp;
              resp = await fetch('mod-connector-wasm.js');
              if (!resp.ok) {
                  throw ('Failed to download wasm-js file');
              }
              const wasmJs = await resp.text();
              resp = await fetch('mod-connector-wasm.wasm');
              if (!resp.ok) {
                  throw ('Failed to download wasm-blob file');
              }
              const wasmBlob = await resp.arrayBuffer();
              const wasmJsFn = new Function(wasmJs + 'return connector;');
              const createModule = wasmJsFn.call();
              // create the wasm module and instance
              createModule({
                  instantiateWasm: (imports, successCallback) => {
                      WebAssembly.instantiate(wasmBlob, imports)
                          .then(output => { successCallback(output.instance, output.module); })
                          // .catch((error) => { wasm.error = '' + error; });
                      return {};
                  },
                  postRun: async function (module) {
                      // setup IPC over WebHID
                      const backend_data = createDataBackendWebHID();
                      hid_connected = false;
                      if (! hid_setup) {
                        hid_setup = true;
                        await backend_data.setup(() => { hid_connected = true; }, () => {});
                      }
                      if (! hid_connected) {
                        await backend_data.connect();
                      }

                      const backend = initDataBackend(backend_data);

                      const fw_version = await backend.fetchFirmwareVersion();
                      if (fw_version.payload.data.capabilities.indexOf("editor") < 0) {
                        console.error("editor not supported in this build");
                        return;
                      }

                      connector = connector_init(backend, module);
                      const state = await connector.connect(hostCallback);

                      if (! state) {
                        console.error("failed to connect, cannot continue");
                        return;
                      }

                      console.log("wasm initialized, connecting now...");
                      connectedCallback(state);
                  },
              });
          }
          catch (error) {
              console.error('wasm init error: ', error);
          }
        };

        document.getElementById('stop').onclick = async () => {
          if (connector == null) {
            return;
          }

          stopping = true;
        };

        const connectedCallback = async (state) => {
              document.getElementById('state').textContent = JSON.stringify(state, null, '  ');

              console.log("connector wasm connected!");

              console.log("test calling C function directly, must return true for 'connected ok' ->", connector.ok());
              console.log("test returning string from C ->", connector.test_string_return());
              /* test sending string to C */ connector.test_string_send("oi oi oi");
              console.log("test message with response, getAverageCpuLoad ->", await connector.getAverageCpuLoad());
              console.log("test message with response, getMaximumCpuLoad ->", await connector.getMaximumCpuLoad());

              // NOTE the code below this line can be used to create a custom chain.
              // because we lack preset data sync, always clear current bank first so we start from a known state
              try {
                  console.log("start wasm usage testing...");

                  // test serializing state
                  console.log(JSON.parse(connector.serializeCurrentPreset()));
                  console.log("wasm usage testing complete!");

                  const poll = async () => {
                    if (stopping) {
                        await connector.disconnect();
                        connector = null;
                        return;
                    }

                    // fetch updates from host, show them on screen
                    await connector.pollHostUpdates();
                    if (! connector.ok()) return;

                    // request more
                    await connector.requestHostUpdates();
                    if (! connector.ok()) return;
                    setTimeout(poll, 100);
                  };

                  poll();
              }
              catch (error) {
                  console.error('wasm test error: ', error);
              }
        };

        const hostCallback = (data) => {
            let split = document.getElementById('feedback').textContent.split("\n");
            if (split.length > 10) {
                split = split.slice(2);
            }
            split.push(JSON.stringify(data));
            document.getElementById('feedback').textContent = split.join("\n");
        };
    </script>
  </body>
</html>
